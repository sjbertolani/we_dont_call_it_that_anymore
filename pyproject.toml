[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoomtranslate"
version = "0.1.0"
description = "Real-time local audio phrase rewriting for meetings."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.4.6",
  "soundfile>=0.12.1",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.0.0",
  "webrtcvad>=2.0.10",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
zoomtranslate = "zoomtranslate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
